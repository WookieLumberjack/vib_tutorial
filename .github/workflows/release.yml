# Builds unsigned standalone apps for Linux, Windows and macOS with PyInstaller.
#
# Pushing a version tag (git tag v0.2.0 && git push origin v0.2.0) builds all three and
# publishes them as a GitHub Release. The tag must match the version in pyproject.toml.
# "Run workflow" on the Actions tab builds them without a release, as does a merge into main
# that changes the packaging or the dependencies (once, not on every push to an open PR);
# the zips are kept as workflow artifacts.
name: Release builds

on:
  push:
    tags: ["v*"]
    branches: [main]
    paths:
      - .github/workflows/release.yml
      - packaging/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest Ubuntu runner, so the build works on older glibc versions too.
          - os: ubuntu-22.04
            name: linux-x86_64
          - os: windows-latest
            name: windows-x64
          - os: macos-latest
            name: macos-arm64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.2.0  # no floating major tags since v8

      - name: Check the tag matches the package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pyproject.toml version $version"
            exit 1
          fi

      - name: Install Qt's X11 libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 \
            libxcb-image0 libxcb-keysyms1 libxcb-render-util0 libxcb-xkb1 libxcb-shape0

      - name: Install dependencies
        run: uv sync --locked --group build

      - name: Run tests
        run: uv run pytest

      - name: Build
        run: uv run pyinstaller packaging/vib-tutorial.spec --noconfirm

      # Launch the packaged app and quit after 2 s, to catch missing modules or plugins. Twice,
      # cold then warm, recording the time to the first painted window so startup regressions
      # show in the job summary. "launch" counts from just before starting the executable, so it
      # includes the bootloader (and macOS's first-launch checks on the cold run); "python" from
      # the interpreter reaching the package; "window" is when MainWindow() was built.
      - name: Smoke-test the build
        run: |
          case "$RUNNER_OS" in
            Linux) exe=dist/vib-tutorial/vib-tutorial ;;
            Windows) exe=dist/vib-tutorial/vib-tutorial.exe ;;
            macOS) exe="dist/Vibration Tutorial.app/Contents/MacOS/vib-tutorial" ;;
          esac
          for run in cold warm; do
            export VIB_TUTORIAL_STARTUP_FILE="startup-$run.json"  # relative: bash and the .exe agree on it
            export VIB_TUTORIAL_LAUNCHED_AT=$(perl -MTime::HiRes=time -e 'printf "%.3f", time')
            "$exe" --smoke-test
            if [ ! -s "$VIB_TUTORIAL_STARTUP_FILE" ]; then
              echo "::error::The $run launch quit without painting its window"
              exit 1
            fi
          done
          uv run --no-project python - <<'PY'
          import json, os
          rows = []
          for run in ("cold", "warm"):
              with open(f"startup-{run}.json") as f:
                  t = json.load(f)
              rows.append(f"| {run} | {t['launch']:.2f} | {t['python']:.2f} | {t['window']:.2f} |")
              print(f"::notice title=Startup ({run})::first window after {t['launch']:.2f} s")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### Startup time, ${{ matrix.name }}\n\n"
                      "| Run | To first window (s) | Since Python start (s) | MainWindow built (s) |\n"
                      "| --- | --- | --- | --- |\n" + "\n".join(rows) + "\n")
          PY

      - name: Package
        run: |
          label="${GITHUB_REF_NAME//\//-}"
          [ "$GITHUB_REF_TYPE" = tag ] || label="${label}-${GITHUB_SHA::7}"
          base="vib-tutorial-${label}-${{ matrix.name }}"
          cd dist
          case "$RUNNER_OS" in
            Linux) tar czf "../$base.tar.gz" vib-tutorial ;;
            Windows) 7z a -tzip -mx=9 "../$base.zip" vib-tutorial > /dev/null ;;
            # ditto keeps the bundle's symlinks and code signature intact.
            macOS) ditto -c -k --keepParent "Vibration Tutorial.app" "../$base.zip" ;;
          esac
          cd ..
          ls -lh vib-tutorial-*

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          path: vib-tutorial-*
          if-no-files-found: error
          compression-level: 0  # already compressed

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: assets
          merge-multiple: true

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Vibration Tutorial $GITHUB_REF_NAME" \
            --notes-file packaging/release-notes.md \
            --generate-notes
