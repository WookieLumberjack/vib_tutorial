[package]
name = "vib-native"
version = "0.1.3"
edition = "2024"
publish = false
description = "Rust kernels for vib_tutorial's hot loops, imported as vib_tutorial._native"
license = "MIT"

[lib]
name = "_native"
crate-type = ["cdylib"]

[dependencies]
# abi3: one build serves every Python from 3.12 on.
pyo3 = { version = "0.30.1", features = ["abi3-py312"] }
numpy = "0.30.0"
# Already in through numpy (ndarray): SIMD matrix products picked at run time (AVX, FMA, NEON).
matrixmultiply = "0.3.11"

[profile.release]
codegen-units = 1
lto = "fat"
