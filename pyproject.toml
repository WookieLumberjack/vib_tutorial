[project]
name = "vib-tutorial"
version = "0.1.1"
description = "Interactive real-time vibration tutorial: lumped mass-spring-damper chain with live modal analysis"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { email = "30199313+WookieLumberjack@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.3",
    "pyqtgraph>=0.14.0",
    "pyside6>=6.11.2",
    "scipy>=1.18.1",
]

[project.scripts]
vib-tutorial = "vib_tutorial:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
build = [
    "pyinstaller>=6.22.3",
]
dev = [
    "pytest>=9.1.1",
]
